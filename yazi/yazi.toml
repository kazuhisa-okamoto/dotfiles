[mgr]
# 一覧の右端に更新日時を常に表示する (m m / m s などで一時的に切り替えられる)
linemode = "mtime"

[opener]
open_nvim = [
	{ run = 'nvim "%s"', block = true, desc = "Open in Neovim", for = "windows" }
]

open_nvim_new_tab = [
	{ run = 'wezterm cli spawn -- nvim "%s"', block = true, desc = "Open in Neovim (new tab)", for = "windows" }
]

open_vscode = [
	# ファイルは、それを含む git リポジトリのルートを workspace にして開く
	{ run = 'code-root "%s"', orphan = true, desc = "Open in VSCode", for = "windows" }
]

open_vs = [
	# ソリューションファイル (.sln / .slnx) を探して Visual Studio で開く (bin/vs.ps1)
	# 複数見つかると fzf で選ぶので block. 見つからないときはメッセージを読めるよう pause
	{ run = 'vs "%s" || pause', block = true, desc = "Open solution in Visual Studio", for = "windows" }
]

open_system = [
	# エクスプローラでダブルクリックしたのと同じ (既定のアプリで開く)
	# start の最初の "" はウィンドウタイトル. 省くと空白を含むパスで失敗する
	{ run = 'start "" "%s"', orphan = true, desc = "Open with default app", for = "windows" }
]

open_tablacus = [
	{ run = 'TE64.exe "%s"', orphan = true, desc = "Open in Tablacus", for = "windows" }
]

[open]
rules = [
    { url = "*/", use = [ "open_nvim", "open_nvim_new_tab", "open_vscode", "open_vs", "open_tablacus" ] },
    # Office / PDF / 画像などは既定アプリを優先 (rules は上から順に最初にマッチしたものが使われる)
    { url = "*.{ppt,pptx,doc,docx,xls,xlsx,xlsm,pdf,png,jpg,jpeg}", use = [ "open_system", "open_nvim" ] },
    { url = "*", use = [ "open_nvim", "open_nvim_new_tab", "open_vscode", "open_vs", "open_system" ] }
]
